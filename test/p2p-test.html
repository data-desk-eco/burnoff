<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Burnoff CRDT Tests</title></head>
<body>
<pre id="log"></pre>
<script type="module">
import { LWWMap, encodeKey, decodeKey, encodeDetection, decodeDetection,
         encodeStringTable, decodeStringTable, encodeStateVector, decodeStateVector,
         encodeEntries, decodeEntries } from '../web/crdt.js';
import { validateDetection, isAllowedCogUrl } from '../web/sync.js';

const el = document.getElementById('log');
const results = [];

function log(msg) { el.textContent += msg + '\n'; }
function assert(condition, name) {
    results.push({ name, ok: !!condition });
    log(condition ? `  PASS: ${name}` : `  FAIL: ${name}`);
}

function approxEqual(a, b, eps = 0.001) {
    return Math.abs(a - b) < eps;
}

async function run() {
    log('=== Burnoff CRDT Test Suite ===\n');

    // 1. LWWMap: set/get/has/keys/forEach/size
    log('1. LWWMap Basic Operations');
    const m = new LWWMap();
    assert(m.size === 0, 'starts empty');
    m.set('a', 1, 100, 1);
    assert(m.get('a') === 1, 'set and get');
    assert(m.has('a'), 'has returns true');
    assert(!m.has('b'), 'has returns false for missing');
    assert(m.size === 1, 'size is 1');

    const keys = Array.from(m.keys());
    assert(keys.length === 1 && keys[0] === 'a', 'keys() works');

    let forEachVal = null;
    m.forEach((v, k) => { forEachVal = v; });
    assert(forEachVal === 1, 'forEach works');

    m.set('b', 2, 101, 1);
    assert(m.size === 2, 'size is 2 after second set');

    m.delete('b');
    assert(m.size === 1, 'size after delete');
    assert(!m.has('b'), 'deleted key gone');

    // 2. LWWMap merge: newer wins, older loses, tie-break on peerId
    log('\n2. LWWMap Merge');
    const m2 = new LWWMap();
    m2.set('x', 'old', 100, 1);
    assert(m2.merge('x', 'new', 200, 1) === true, 'newer ts wins');
    assert(m2.get('x') === 'new', 'value updated to newer');

    assert(m2.merge('x', 'oldest', 50, 1) === false, 'older ts loses');
    assert(m2.get('x') === 'new', 'value unchanged after old merge');

    // Tie-break: higher peerId wins
    m2.set('y', 'peer1', 100, 1);
    assert(m2.merge('y', 'peer2', 100, 2) === true, 'higher peerId wins tie');
    assert(m2.get('y') === 'peer2', 'value is from higher peerId');

    assert(m2.merge('y', 'peer0', 100, 0) === false, 'lower peerId loses tie');
    assert(m2.get('y') === 'peer2', 'value unchanged after lower peerId');

    // 3. LWWMap onChange
    log('\n3. LWWMap onChange');
    const m3 = new LWWMap();
    let changeCount = 0;
    let lastSource = null;
    m3.onChange = (key, value, source) => { changeCount++; lastSource = source; };

    m3.set('k', 1, 100, 1);
    assert(changeCount === 1, 'onChange fires on set');
    assert(lastSource === 'local', 'source is local on set');

    m3.merge('k', 2, 200, 2);
    assert(changeCount === 2, 'onChange fires on winning merge');
    assert(lastSource === 'remote', 'source is remote on merge');

    m3.merge('k', 0, 50, 0);
    assert(changeCount === 2, 'onChange not fired on losing merge');

    // 4. Binary key encode/decode roundtrip
    log('\n4. Binary Key Codec');
    const testKey = '31RDL_10_20:2024-01-15';
    const encoded = encodeKey(testKey);
    assert(encoded.length === 9, 'key encodes to 9 bytes');

    const decoded = decodeKey(encoded, 0);
    assert(decoded.key === testKey, 'key roundtrips: ' + decoded.key);
    assert(decoded.mgrs === '31RDL', 'mgrs decoded');
    assert(decoded.row === 10, 'row decoded');
    assert(decoded.col === 20, 'col decoded');
    assert(decoded.date === '2024-01-15', 'date decoded');

    // Different key
    const testKey2 = '40RBN_5_5:2023-06-30';
    const encoded2 = encodeKey(testKey2);
    const decoded2 = decodeKey(encoded2, 0);
    assert(decoded2.key === testKey2, 'second key roundtrips: ' + decoded2.key);

    // 5. Binary detection encode/decode roundtrip
    log('\n5. Binary Detection Codec');
    const det = {
        date: '2024-01-15', max_b12: 0.95, avg_b12: 0.80, pixels: 5,
        flare_lon: 51.5, flare_lat: 25.9, epsg: 32639,
        sun_elevation: 42, utm_bounds: [500000, 2800000, 500100, 2800100],
        block_row: 10, block_col: 20, mgrs: '31RDL',
        cog_b12: 'https://earth-search.aws.element84.com/test.tif'
    };
    const strTable = ['https://earth-search.aws.element84.com/test.tif'];
    const detBuf = encodeDetection(det, 0);
    assert(detBuf.length === 44, 'detection encodes to 44 bytes');

    const detDec = decodeDetection(detBuf, 0, strTable);
    assert(detDec.date === '2024-01-15', 'det date roundtrips');
    assert(approxEqual(detDec.max_b12, 0.95, 0.001), 'det max_b12 roundtrips');
    assert(approxEqual(detDec.avg_b12, 0.80, 0.001), 'det avg_b12 roundtrips');
    assert(detDec.pixels === 5, 'det pixels roundtrips');
    assert(approxEqual(detDec.flare_lon, 51.5, 0.001), 'det lon roundtrips');
    assert(approxEqual(detDec.flare_lat, 25.9, 0.001), 'det lat roundtrips');
    assert(detDec.epsg === 32639, 'det epsg roundtrips');
    assert(detDec.sun_elevation === 42, 'det sun_elevation roundtrips');
    assert(detDec.mgrs === '31RDL', 'det mgrs roundtrips');
    assert(detDec.cog_b12 === strTable[0], 'det cog_b12 from string table');

    // Null sun_elevation
    const det2 = { ...det, sun_elevation: null };
    const detBuf2 = encodeDetection(det2, 0);
    const detDec2 = decodeDetection(detBuf2, 0, strTable);
    assert(detDec2.sun_elevation === null, 'null sun_elevation roundtrips');

    // 6. State vector encode/decode roundtrip
    log('\n6. State Vector Codec');
    const svDet = new LWWMap();
    const svProc = new LWWMap();
    svDet.set('31RDL_10_20:2024-01-15', [det], 1000000, 42);
    svProc.set('31RDL_10_20:2024-01-15', 1000000, 1000000, 42);

    const svBuf = encodeStateVector(svDet, svProc);
    const svDec = decodeStateVector(svBuf);
    assert(svDec.det.size === 1, 'SV det count correct');
    assert(svDec.proc.size === 1, 'SV proc count correct');
    assert(svDec.det.has('31RDL_10_20:2024-01-15'), 'SV det key present');
    assert(svDec.proc.has('31RDL_10_20:2024-01-15'), 'SV proc key present');

    // 7. State diff encode/decode roundtrip
    log('\n7. Entry Codec (State Diff)');
    const diffDet = new LWWMap();
    const diffProc = new LWWMap();
    const dets = [
        { date: '2024-01-15', max_b12: 0.95, avg_b12: 0.80, pixels: 5,
          flare_lon: 51.5, flare_lat: 25.9, epsg: 32639, sun_elevation: 42,
          utm_bounds: [500000, 2800000, 500100, 2800100], block_row: 10,
          block_col: 20, mgrs: '31RDL',
          cog_b12: 'https://earth-search.aws.element84.com/test.tif' }
    ];
    const ts = Date.now();
    diffDet.set('31RDL_10_20:2024-01-15', dets, ts, 42);
    diffProc.set('31RDL_10_20:2024-01-15', ts, ts, 42);

    const entryKeys = [
        { mapName: 'det', key: '31RDL_10_20:2024-01-15' },
        { mapName: 'proc', key: '31RDL_10_20:2024-01-15' }
    ];
    const entryBuf = encodeEntries(entryKeys, diffDet, diffProc);
    const entries = decodeEntries(entryBuf);
    assert(entries.length === 2, 'decoded 2 entries');

    const detEntry = entries.find(e => e.mapName === 'det');
    assert(detEntry !== undefined, 'det entry found');
    assert(Array.isArray(detEntry.value) && detEntry.value.length === 1, 'det has 1 detection');
    assert(approxEqual(detEntry.value[0].max_b12, 0.95, 0.001), 'det value max_b12 correct');
    assert(detEntry.value[0].cog_b12 === 'https://earth-search.aws.element84.com/test.tif', 'cog_b12 via string table');

    const procEntry = entries.find(e => e.mapName === 'proc');
    assert(procEntry !== undefined, 'proc entry found');
    assert(typeof procEntry.value === 'number', 'proc value is number');

    // 8. Two-map sync simulation
    log('\n8. Two-Map Sync Simulation');
    const mapA_det = new LWWMap();
    const mapA_proc = new LWWMap();
    const mapB_det = new LWWMap();
    const mapB_proc = new LWWMap();

    // A has data
    mapA_det.set('31RDL_10_20:2024-01-15', dets, ts, 1);
    mapA_proc.set('31RDL_10_20:2024-01-15', ts, ts, 1);

    // B sends SV (empty), A computes diff
    const svB = encodeStateVector(mapB_det, mapB_proc);
    const svBDec = decodeStateVector(svB);

    // Find what A has that B doesn't
    const toSend = [];
    mapA_det._entries.forEach((entry, key) => {
        if (!svBDec.det.has(key)) toSend.push({ mapName: 'det', key });
    });
    mapA_proc._entries.forEach((entry, key) => {
        if (!svBDec.proc.has(key)) toSend.push({ mapName: 'proc', key });
    });

    const diffBuf = encodeEntries(toSend, mapA_det, mapA_proc);
    const diffEntries = decodeEntries(diffBuf);

    // Apply to B
    for (const e of diffEntries) {
        if (e.mapName === 'det') mapB_det.merge(e.key, e.value, e.ts, e.peerId);
        else mapB_proc.merge(e.key, e.value, e.ts, e.peerId);
    }

    assert(mapB_det.size === 1, 'B got detection from A');
    assert(mapB_proc.size === 1, 'B got processed from A');
    assert(mapB_det.has('31RDL_10_20:2024-01-15'), 'B has correct key');

    // 9. Bidirectional sync convergence
    log('\n9. Bidirectional Sync');
    // B adds new data
    const dets2 = [
        { date: '2024-02-01', max_b12: 1.10, avg_b12: 0.90, pixels: 3,
          flare_lon: 52.0, flare_lat: 26.0, epsg: 32639, sun_elevation: 35,
          utm_bounds: [500200, 2800200, 500300, 2800300], block_row: 5,
          block_col: 5, mgrs: '40RBN',
          cog_b12: 'https://earth-search.aws.element84.com/test2.tif' }
    ];
    const ts2 = ts + 1000;
    mapB_det.set('40RBN_5_5:2024-02-01', dets2, ts2, 2);
    mapB_proc.set('40RBN_5_5:2024-02-01', ts2, ts2, 2);

    // A sends SV, B computes diff
    const svA = encodeStateVector(mapA_det, mapA_proc);
    const svADec = decodeStateVector(svA);

    const toSendB = [];
    mapB_det._entries.forEach((entry, key) => {
        const r = svADec.det.get(key);
        if (!r || entry.ts / 1000 > r.ts) toSendB.push({ mapName: 'det', key });
    });
    mapB_proc._entries.forEach((entry, key) => {
        const r = svADec.proc.get(key);
        if (!r || entry.ts / 1000 > r.ts) toSendB.push({ mapName: 'proc', key });
    });

    const diffBuf2 = encodeEntries(toSendB, mapB_det, mapB_proc);
    const diffEntries2 = decodeEntries(diffBuf2);

    for (const e of diffEntries2) {
        if (e.mapName === 'det') mapA_det.merge(e.key, e.value, e.ts, e.peerId);
        else mapA_proc.merge(e.key, e.value, e.ts, e.peerId);
    }

    assert(mapA_det.size === 2, 'A has 2 detections after bidir sync');
    assert(mapA_det.has('40RBN_5_5:2024-02-01'), 'A got new key from B');
    assert(mapB_det.size === 2, 'B has 2 detections');

    // 10. Validation
    log('\n10. Validation');
    assert(validateDetection({
        date: '2024-01-15', max_b12: 0.95, pixels: 5,
        flare_lon: 51.5, flare_lat: 25.9,
        cog_b12: 'https://earth-search.aws.element84.com/test.tif'
    }), 'valid detection passes');

    assert(!validateDetection({ date: '2024-01-15', max_b12: 0.95, pixels: 5,
        flare_lon: 200, flare_lat: 25.9 }), 'invalid lon rejected');

    assert(!validateDetection({ date: '2024-01-15', max_b12: 0.95, pixels: 5,
        flare_lon: 51.5, flare_lat: 100 }), 'invalid lat rejected');

    assert(!validateDetection({ date: 'bad', max_b12: 0.95, pixels: 5,
        flare_lon: 51.5, flare_lat: 25.9 }), 'invalid date rejected');

    assert(!validateDetection({ date: '2024-01-15', max_b12: 15, pixels: 5,
        flare_lon: 51.5, flare_lat: 25.9 }), 'unreasonable max_b12 rejected');

    assert(!validateDetection({ date: '2024-01-15', max_b12: 0.95, pixels: 5,
        flare_lon: 51.5, flare_lat: 25.9,
        cog_b12: 'https://evil.com/hack.tif' }), 'disallowed COG URL rejected');

    assert(isAllowedCogUrl(null), 'null cog_url allowed');
    assert(isAllowedCogUrl('https://sentinel-cogs.s3.us-west-2.amazonaws.com/foo'), 'sentinel URL allowed');
    assert(!isAllowedCogUrl('https://evil.com/bad'), 'evil URL rejected');

    // 11. String table dedup for COG URLs
    log('\n11. String Table');
    const urls = [
        'https://earth-search.aws.element84.com/a.tif',
        'https://earth-search.aws.element84.com/b.tif',
        'https://earth-search.aws.element84.com/a.tif'  // duplicate
    ];
    const uniqueUrls = [...new Set(urls)];
    const stBuf = encodeStringTable(uniqueUrls);
    const stDec = decodeStringTable(stBuf, 0);
    assert(stDec.strings.length === 2, 'string table has 2 unique URLs');
    assert(stDec.strings[0] === uniqueUrls[0], 'first URL correct');
    assert(stDec.strings[1] === uniqueUrls[1], 'second URL correct');

    // 12. Empty block caching (processed but no detections)
    log('\n12. Empty Block Cache');
    const emptyDet = new LWWMap();
    const emptyProc = new LWWMap();
    emptyProc.set('31RDL_0_0:2024-03-01', Date.now(), Date.now(), 1);
    assert(emptyProc.has('31RDL_0_0:2024-03-01'), 'empty block marked processed');
    assert(!emptyDet.has('31RDL_0_0:2024-03-01'), 'no detection entry for empty block');

    // Summary
    const passed = results.filter(r => r.ok).length;
    const total = results.length;
    log(`\n=== ${passed}/${total} tests passed ===`);

    // Signal completion for headless runner
    window.__testResults = { passed, total, results };
}

run().catch(e => { log('ERROR: ' + e.message); console.error(e); });
</script>
</body>
</html>
