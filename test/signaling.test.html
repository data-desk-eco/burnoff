<!DOCTYPE html>
<html>
<head><title>signaling test</title></head>
<body>
<pre id="log"></pre>
<script>
const URL = new URLSearchParams(location.search).get('url') || 'ws://localhost:8787';
const log = document.getElementById('log');
let passed = 0, failed = 0;

function print(s) { log.textContent += s + '\n'; console.log(s); }

function connect() {
    return new Promise((resolve, reject) => {
        const ws = new WebSocket(URL);
        ws.onopen = () => resolve(ws);
        ws.onerror = () => reject(new Error('connect failed'));
        setTimeout(() => reject(new Error('connect timeout')), 5000);
    });
}

function waitMsg(ws, timeout = 3000) {
    return new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(new Error('message timeout')), timeout);
        ws.onmessage = (e) => { clearTimeout(t); resolve(JSON.parse(e.data)); };
    });
}

async function test(name, fn) {
    try {
        await fn();
        passed++;
        print('  PASS  ' + name);
    } catch (e) {
        failed++;
        print('  FAIL  ' + name + ': ' + e.message);
    }
}

async function run() {
    print('signaling tests against ' + URL + '\n');

    await test('ping/pong', async () => {
        const ws = await connect();
        ws.send(JSON.stringify({ type: 'ping' }));
        const msg = await waitMsg(ws);
        if (msg.type !== 'pong') throw new Error('expected pong, got ' + msg.type);
        ws.close();
    });

    await test('publish relays to subscriber', async () => {
        const ws1 = await connect();
        const ws2 = await connect();
        ws1.send(JSON.stringify({ type: 'subscribe', topics: ['room-a'] }));
        ws2.send(JSON.stringify({ type: 'subscribe', topics: ['room-a'] }));
        await new Promise(r => setTimeout(r, 300));
        const pending = waitMsg(ws1);
        ws2.send(JSON.stringify({ type: 'publish', topic: 'room-a', kind: 'test', data: 'hello' }));
        const msg = await pending;
        if (msg.kind !== 'test' || msg.data !== 'hello') throw new Error('wrong message: ' + JSON.stringify(msg));
        ws1.close(); ws2.close();
    });

    await test('publish does not echo to sender', async () => {
        const ws = await connect();
        ws.send(JSON.stringify({ type: 'subscribe', topics: ['room-b'] }));
        await new Promise(r => setTimeout(r, 300));
        ws.send(JSON.stringify({ type: 'publish', topic: 'room-b', kind: 'echo' }));
        const got = await Promise.race([
            waitMsg(ws, 1000).then(() => true).catch(() => false),
            new Promise(r => setTimeout(() => r(false), 1200)),
        ]);
        if (got) throw new Error('received own message');
        ws.close();
    });

    await test('non-subscriber does not receive', async () => {
        const ws1 = await connect();
        const ws2 = await connect();
        ws1.send(JSON.stringify({ type: 'subscribe', topics: ['room-c'] }));
        // ws2 not subscribed
        await new Promise(r => setTimeout(r, 300));
        const pending = waitMsg(ws1);
        ws2.send(JSON.stringify({ type: 'publish', topic: 'room-c', kind: 'x' }));
        const msg = await pending;
        if (msg.kind !== 'x') throw new Error('wrong message');
        const ws2got = await Promise.race([
            waitMsg(ws2, 500).then(() => true).catch(() => false),
            new Promise(r => setTimeout(() => r(false), 700)),
        ]);
        if (ws2got) throw new Error('non-subscriber received message');
        ws1.close(); ws2.close();
    });

    print('\n' + passed + ' passed, ' + failed + ' failed');
    document.title = failed === 0 ? 'PASS' : 'FAIL';
}

run().catch(e => print('FATAL: ' + e.message));
</script>
</body>
</html>
