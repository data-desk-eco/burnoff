name: VNF daily backfill

on:
  schedule:
    # Run daily at 10:00 UTC (after all VIIRS orbits for the previous day)
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml duckdb

      - name: Fetch shared skill libs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -sL -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/data-desk-eco/.github/tarball/main | \
            tar -xz --strip-components=1 --wildcards '*/.claude'

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCS_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Run backfill
        env:
          VNF_PASSWORD: ${{ secrets.VNF_PASSWORD }}
        run: python scripts/backfill_vnf.py
