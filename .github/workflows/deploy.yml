name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Prepare dist
        run: |
          mkdir -p dist
          cp -r web/* dist/          # whole tracked web tree (modules, s2/ wasm, vendor)
          sed -i "s/app\.js?v=[^\"]*/app.js?v=${GITHUB_SHA::8}/" dist/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
