name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare dist
        run: |
          mkdir -p dist/assets
          cp web/index.html web/app.js web/style.css web/detect.js web/crdt.js web/store.js web/rtc.js web/sync.js web/utm.js web/vnf.js web/terminals.geojson web/concessions.geojson web/blocks.geojson dist/
          cp -r web/assets/* dist/assets/
          cp -r web/vendor dist/vendor

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
