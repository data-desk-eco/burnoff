name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Deploy web app to GitHub Pages
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare dist
        run: |
          mkdir -p dist
          cp index.html dist/

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # Upload PMTiles to GCS when data/detections.pmtiles changes
  deploy-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for PMTiles
        id: check
        run: |
          if [ -f "data/detections.pmtiles" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        if: steps.check.outputs.exists == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCS_SERVICE_ACCOUNT_KEY }}

      - name: Upload to GCS
        if: steps.check.outputs.exists == 'true'
        run: |
          gcloud storage cp data/detections.pmtiles gs://burnoff-data/ \
            --cache-control="public, max-age=3600"
          echo "Deployed to: https://storage.googleapis.com/burnoff-data/detections.pmtiles"
