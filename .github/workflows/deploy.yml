name: Deploy

# the map moved to flux.datadesk.eco. this deploy publishes the forwarder in
# redirect/ and nothing else — web/ stays in the repository for its history,
# but it is no longer served from here.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v5
