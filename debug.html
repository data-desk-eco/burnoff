<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burnoff Debug</title>
    <link href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; display: flex; height: 100vh; background: #111; color: #eee; }
        #map { flex: 1; }
        #controls {
            width: 320px;
            padding: 16px;
            overflow-y: auto;
            background: #1a1a1a;
            border-left: 1px solid #333;
        }
        h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #888; margin: 16px 0 8px; }
        h3:first-child { margin-top: 0; }
        .control { margin-bottom: 12px; }
        .control label { display: block; font-size: 12px; margin-bottom: 4px; }
        .control input[type="range"] { width: 100%; }
        .control .value { float: right; color: #f90; }
        select { width: 100%; padding: 6px; background: #222; color: #eee; border: 1px solid #444; font-family: inherit; }
        #stats { font-size: 11px; color: #888; margin-top: 16px; padding-top: 16px; border-top: 1px solid #333; }
        #stats div { margin: 4px 0; }
        #stats span { color: #f90; }
        .legend { margin-top: 16px; padding-top: 16px; border-top: 1px solid #333; }
        .legend-item { display: flex; align-items: center; font-size: 11px; margin: 4px 0; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="message" style="display:none; position:absolute; top:16px; left:50%; transform:translateX(-50%); background:#333; color:#fa0; padding:8px 16px; font-size:12px; border-radius:4px; z-index:10;"></div>
    <div id="controls">
        <h3>Terminal</h3>
        <select id="terminal-select"></select>

        <h3>Export Filters</h3>
        <div class="control">
            <label>Min Peak B12 <span class="value" id="v-min-b12">0.75</span></label>
            <input type="range" id="min-b12" min="0.3" max="1.5" step="0.05" value="0.75">
        </div>
        <div class="control">
            <label>Min Detection Dates <span class="value" id="v-min-dates">2</span></label>
            <input type="range" id="min-dates" min="1" max="10" step="1" value="2">
        </div>

        <h3>Clustering</h3>
        <div class="control">
            <label>Base Merge Distance (m) <span class="value" id="v-merge-base">50</span></label>
            <input type="range" id="merge-base" min="20" max="200" step="10" value="50">
        </div>
        <div class="control">
            <label>Small Detection Multiplier <span class="value" id="v-small-mult">12</span></label>
            <input type="range" id="small-mult" min="5" max="20" step="1" value="12">
        </div>
        <div class="control">
            <label>Small Detection Cap (m) <span class="value" id="v-small-cap">250</span></label>
            <input type="range" id="small-cap" min="100" max="500" step="25" value="250">
        </div>
        <div class="control">
            <label>Co-occur Penalty <span class="value" id="v-cooccur">0.20</span></label>
            <input type="range" id="cooccur" min="0" max="0.5" step="0.05" value="0.2">
        </div>

        <h3>Display</h3>
        <div class="control">
            <label>Show Merge Radii <span class="value" id="v-show-radii">On</span></label>
            <input type="range" id="show-radii" min="0" max="1" step="1" value="1">
        </div>

        <div id="stats">
            <div>Raw detections: <span id="stat-raw">-</span></div>
            <div>After clustering: <span id="stat-clustered">-</span></div>
            <div>After filtering: <span id="stat-filtered">-</span></div>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background: #ff0;"></div> High B12 (&gt;1.0)</div>
            <div class="legend-item"><div class="legend-dot" style="background: #f80;"></div> Medium (0.6-1.0)</div>
            <div class="legend-item"><div class="legend-dot" style="background: #b36;"></div> Low (&lt;0.6)</div>
            <div class="legend-item"><div class="legend-dot" style="border: 2px solid #fff; background: transparent;"></div> Cluster centroid</div>
            <div class="legend-item"><div class="legend-dot" style="border: 1px dashed #666; background: transparent;"></div> Merge radius</div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/geotiff@2.1.3/dist-browser/geotiff.js"></script>
    <script src="https://unpkg.com/proj4@2.9.2/dist/proj4.js"></script>
    <script>
        let rawData = [];
        let currentTerminal = null;

        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'satellite': {
                        type: 'raster',
                        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                        tileSize: 256
                    }
                },
                layers: [{ id: 'basemap', type: 'raster', source: 'satellite' }]
            },
            center: [51.5, 26],
            zoom: 10
        });

        // Color by B12 intensity
        function b12Color(b12) {
            if (b12 >= 1.0) return '#ffff00';
            if (b12 >= 0.6) return '#ff8800';
            return '#bb3366';
        }

        // Detection radius in meters (20m pixels)
        function detectionRadius(pixels) {
            return Math.sqrt(pixels / Math.PI) * 20;
        }

        // Merge threshold between two detections
        function mergeThreshold(pxA, pxB, params) {
            const rA = detectionRadius(pxA);
            const rB = detectionRadius(pxB);
            if (Math.max(pxA, pxB) < 10) {
                return Math.max(params.mergeBase, Math.min(params.smallCap, Math.max(rA, rB) * params.smallMult));
            }
            return Math.max(params.mergeBase, rA + rB);
        }

        // Haversine distance in meters
        function distanceM(lon1, lat1, lon2, lat2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
            return 2 * R * Math.asin(Math.sqrt(a));
        }

        // Grid key for co-occurrence (~30m)
        function locKey(lon, lat) {
            return `${lat.toFixed(4)},${lon.toFixed(4)}`;
        }

        // Cluster raw detections
        function clusterDetections(detections, params) {
            if (!detections.length) return [];

            // Build co-occurrence map
            const dateToLocs = {};
            detections.forEach(d => {
                if (!dateToLocs[d.date]) dateToLocs[d.date] = new Set();
                dateToLocs[d.date].add(locKey(d.flare_lon, d.flare_lat));
            });

            const cooccur = {};
            Object.values(dateToLocs).forEach(locs => {
                const arr = [...locs];
                for (let i = 0; i < arr.length; i++) {
                    for (let j = i + 1; j < arr.length; j++) {
                        const key = [arr[i], arr[j]].sort().join('|');
                        cooccur[key] = (cooccur[key] || 0) + 1;
                    }
                }
            });

            // Union-find clustering
            const parent = detections.map((_, i) => i);
            function find(i) { return parent[i] === i ? i : (parent[i] = find(parent[i])); }
            function union(i, j) { parent[find(i)] = find(j); }

            for (let i = 0; i < detections.length; i++) {
                for (let j = i + 1; j < detections.length; j++) {
                    const a = detections[i], b = detections[j];
                    const dist = distanceM(a.flare_lon, a.flare_lat, b.flare_lon, b.flare_lat);
                    let threshold = mergeThreshold(a.pixels, b.pixels, params);

                    // Co-occurrence penalty
                    const coKey = [locKey(a.flare_lon, a.flare_lat), locKey(b.flare_lon, b.flare_lat)].sort().join('|');
                    const coCount = cooccur[coKey] || 0;
                    if (coCount > 0) {
                        threshold *= (1 - Math.min(0.5, coCount * params.cooccurPenalty));
                    }

                    if (dist <= threshold) union(i, j);
                }
            }

            // Group by cluster
            const groups = {};
            detections.forEach((d, i) => {
                const root = find(i);
                if (!groups[root]) groups[root] = [];
                groups[root].push(d);
            });

            // Compute cluster properties
            return Object.values(groups).map(members => {
                const lon = members.reduce((s, m) => s + m.flare_lon, 0) / members.length;
                const lat = members.reduce((s, m) => s + m.flare_lat, 0) / members.length;
                const maxB12 = Math.max(...members.map(m => m.max_b12));
                const dates = new Set(members.map(m => m.date));
                const maxPx = Math.max(...members.map(m => m.pixels));
                return { lon, lat, max_b12: maxB12, detection_count: dates.size, members, maxPx };
            });
        }

        // Get current params from sliders
        function getParams() {
            return {
                minB12: parseFloat(document.getElementById('min-b12').value),
                minDates: parseInt(document.getElementById('min-dates').value),
                mergeBase: parseFloat(document.getElementById('merge-base').value),
                smallMult: parseFloat(document.getElementById('small-mult').value),
                smallCap: parseFloat(document.getElementById('small-cap').value),
                cooccurPenalty: parseFloat(document.getElementById('cooccur').value),
                showRadii: document.getElementById('show-radii').value === '1'
            };
        }

        // Update display values
        function updateValueDisplays() {
            document.getElementById('v-min-b12').textContent = document.getElementById('min-b12').value;
            document.getElementById('v-min-dates').textContent = document.getElementById('min-dates').value;
            document.getElementById('v-merge-base').textContent = document.getElementById('merge-base').value;
            document.getElementById('v-small-mult').textContent = document.getElementById('small-mult').value;
            document.getElementById('v-small-cap').textContent = document.getElementById('small-cap').value;
            document.getElementById('v-cooccur').textContent = parseFloat(document.getElementById('cooccur').value).toFixed(2);
            document.getElementById('v-show-radii').textContent = document.getElementById('show-radii').value === '1' ? 'On' : 'Off';
        }

        // Render detections on map
        function render() {
            if (!currentTerminal) return;
            const params = getParams();
            updateValueDisplays();

            // Flatten raw detections
            const raw = currentTerminal.detection_dates.filter(d => d.flare_lon && d.flare_lat);
            document.getElementById('stat-raw').textContent = raw.length;

            // Cluster
            const clusters = clusterDetections(raw, params);
            document.getElementById('stat-clustered').textContent = clusters.length;

            // Filter
            const filtered = clusters.filter(c => c.max_b12 >= params.minB12 && c.detection_count >= params.minDates);
            document.getElementById('stat-filtered').textContent = filtered.length;

            // Build GeoJSON for raw points
            const rawFeatures = raw.map(d => ({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [d.flare_lon, d.flare_lat] },
                properties: { max_b12: d.max_b12, pixels: d.pixels, date: d.date, cog_b12: d.cog?.b12, epsg: d.epsg }
            }));

            // Build GeoJSON for cluster centroids
            const clusterFeatures = clusters.map(c => ({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [c.lon, c.lat] },
                properties: { max_b12: c.max_b12, detection_count: c.detection_count, passed: c.max_b12 >= params.minB12 && c.detection_count >= params.minDates }
            }));

            // Build merge radius circles (approximate, in degrees)
            const radiusFeatures = [];
            if (params.showRadii) {
                raw.forEach(d => {
                    const r = mergeThreshold(d.pixels, d.pixels, params);
                    const degPerM = 1 / (111320 * Math.cos(d.flare_lat * Math.PI / 180));
                    const coords = [];
                    for (let i = 0; i <= 64; i++) {
                        const angle = (i / 64) * 2 * Math.PI;
                        coords.push([d.flare_lon + r * degPerM * Math.cos(angle), d.flare_lat + r * (1/111320) * Math.sin(angle)]);
                    }
                    radiusFeatures.push({
                        type: 'Feature',
                        geometry: { type: 'Polygon', coordinates: [coords] },
                        properties: {}
                    });
                });
            }

            // Update sources
            map.getSource('raw-points')?.setData({ type: 'FeatureCollection', features: rawFeatures });
            map.getSource('clusters')?.setData({ type: 'FeatureCollection', features: clusterFeatures });
            map.getSource('radii')?.setData({ type: 'FeatureCollection', features: radiusFeatures });
        }

        map.on('load', async () => {
            // Add sources
            map.addSource('radii', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            map.addSource('raw-points', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            map.addSource('clusters', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

            // Merge radius circles
            map.addLayer({
                id: 'radii',
                type: 'line',
                source: 'radii',
                paint: { 'line-color': '#666', 'line-width': 1, 'line-dasharray': [2, 2] }
            });

            // Raw detection points
            map.addLayer({
                id: 'raw-points',
                type: 'circle',
                source: 'raw-points',
                paint: {
                    'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 4, 16, 8],
                    'circle-color': ['interpolate', ['linear'], ['get', 'max_b12'], 0.3, '#bb3366', 0.6, '#ff8800', 1.0, '#ffff00'],
                    'circle-opacity': 0.8,
                    'circle-stroke-color': '#000',
                    'circle-stroke-width': 1
                }
            });

            // Cluster centroids
            map.addLayer({
                id: 'clusters',
                type: 'circle',
                source: 'clusters',
                paint: {
                    'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 8, 16, 14],
                    'circle-color': 'transparent',
                    'circle-stroke-color': ['case', ['get', 'passed'], '#fff', '#f44'],
                    'circle-stroke-width': 2
                }
            });

            // Load data
            const resp = await fetch('data/detections.json');
            rawData = await resp.json();

            // Populate terminal selector
            const select = document.getElementById('terminal-select');
            rawData.forEach((t, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${t.detection_dates?.length || 0} det @ ${t.lat.toFixed(2)}, ${t.lon.toFixed(2)}`;
                select.appendChild(opt);
            });

            select.onchange = () => {
                currentTerminal = rawData[select.value];
                map.flyTo({ center: [currentTerminal.lon, currentTerminal.lat], zoom: 12 });
                render();
            };

            // Bind slider events - use addEventListener for reliable dynamic updates
            document.querySelectorAll('#controls input[type="range"]').forEach(el => {
                el.addEventListener('input', render);
            });

            // Select first terminal
            if (rawData.length) {
                currentTerminal = rawData[0];
                map.flyTo({ center: [currentTerminal.lon, currentTerminal.lat], zoom: 12 });
                render();
            }

            // Click to load imagery
            map.on('click', 'raw-points', async (e) => {
                const props = e.features[0].properties;
                const [lon, lat] = e.features[0].geometry.coordinates;
                await loadCOG(props.cog_b12, lon, lat, props.epsg);
            });

            map.on('mouseenter', 'raw-points', () => map.getCanvas().style.cursor = 'pointer');
            map.on('mouseleave', 'raw-points', () => map.getCanvas().style.cursor = '');
        });

        // Magma colormap
        function magmaColor(t) {
            const colors = [[0,0,4],[40,11,84],[101,21,110],[159,42,99],[212,72,66],[245,125,21],[250,193,39],[255,255,0]];
            const idx = Math.min(Math.floor(t * (colors.length - 1)), colors.length - 2);
            const f = t * (colors.length - 1) - idx;
            return colors[idx].map((c, i) => Math.round(c + f * (colors[idx+1][i] - c)));
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.style.display = msg ? 'block' : 'none';
        }

        async function loadCOG(url, lon, lat, epsg) {
            // Clear any existing COG layer
            if (map.getLayer('cog')) map.removeLayer('cog');
            if (map.getSource('cog')) map.removeSource('cog');

            // L1C data uses JP2 which GeoTIFF.js can't read
            if (!url || typeof url !== 'string' || !url.startsWith('http') || url.includes('.jp2') || !url.includes('.tif')) {
                showMessage('Visual imagery not yet available (L1C only)');
                return;
            }
            showMessage('Loading imagery...');
            try {
                const zone = epsg % 100;
                const isNorth = epsg < 32700;
                const utmProj = `+proj=utm +zone=${zone} ${isNorth ? '' : '+south '}+datum=WGS84 +units=m +no_defs`;
                const [utmX, utmY] = proj4('EPSG:4326', utmProj, [lon, lat]);
                const buffer = 500;

                const tiff = await GeoTIFF.fromUrl(url, { allowFullFile: false });
                const image = await tiff.getImage();
                const [imgMinX, imgMinY, imgMaxX, imgMaxY] = image.getBoundingBox();
                const resX = (imgMaxX - imgMinX) / image.getWidth();
                const resY = (imgMaxY - imgMinY) / image.getHeight();

                const x0 = Math.max(0, Math.floor((utmX - buffer - imgMinX) / resX));
                const y0 = Math.max(0, Math.floor((imgMaxY - utmY - buffer) / resY));
                const x1 = Math.min(image.getWidth(), Math.ceil((utmX + buffer - imgMinX) / resX));
                const y1 = Math.min(image.getHeight(), Math.ceil((imgMaxY - utmY + buffer) / resY));

                const rasters = await image.readRasters({ window: [x0, y0, x1, y1], width: Math.min(x1-x0, 256), height: Math.min(y1-y0, 256) });
                const data = rasters[0], w = rasters.width, h = rasters.height;

                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                const imgData = ctx.createImageData(w, h);

                for (let i = 0; i < data.length; i++) {
                    const v = data[i] * 0.0001 - 0.1;
                    const t = v <= 0.3 ? 0 : Math.min(1, (v - 0.3) / 1.2);
                    const [r, g, b] = magmaColor(t);
                    imgData.data[i*4] = r; imgData.data[i*4+1] = g; imgData.data[i*4+2] = b; imgData.data[i*4+3] = 255;
                }
                ctx.putImageData(imgData, 0, 0);

                const bounds = [
                    proj4(utmProj, 'EPSG:4326', [imgMinX + x0*resX, imgMaxY - y1*resY]),
                    proj4(utmProj, 'EPSG:4326', [imgMinX + x1*resX, imgMaxY - y0*resY])
                ];

                if (map.getLayer('cog')) map.removeLayer('cog');
                if (map.getSource('cog')) map.removeSource('cog');

                map.addSource('cog', {
                    type: 'image',
                    url: canvas.toDataURL(),
                    coordinates: [[bounds[0][0], bounds[1][1]], [bounds[1][0], bounds[1][1]], [bounds[1][0], bounds[0][1]], [bounds[0][0], bounds[0][1]]]
                });
                map.addLayer({ id: 'cog', type: 'raster', source: 'cog', paint: { 'raster-opacity': 0.9 } }, 'radii');
            } catch (e) {
                console.error('COG load failed:', e);
                showMessage('Failed to load imagery');
            }
        }
    </script>
</body>
</html>
