[project]
name = "burnoff"
version = "0.1.0"
description = "Sentinel-2 flare detection pipeline"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "numpy>=1.24",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "scipy>=1.15.3",
    "duckdb>=1.4.3",
]

[project.scripts]
burnoff = "burnoff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
