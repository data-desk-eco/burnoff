<!doctype html>
<meta charset="utf-8">
<title>Burnoff in the browser</title>
<pre id="out"></pre>
<script type="module">
// detect(url, box, n): the box split into n columns of whole 6.4 km cells,
// each on a worker of its own, and the rows merged
const pool = []
const work = () => new Promise(r => {
  const w = new Worker('worker.js', {type: 'module'})
  w.onmessage = () => r(w)
})
const ask = (w, a) => new Promise(r => {
  w.onmessage = e => r(e.data), w.postMessage(a)
})
window.detect = async (u, [x0, y0, x1, y1], n = 1) => {
  while (pool.length < n) pool.push(await work())
  const c = Math.ceil((x1 - x0) / 6400 / n) * 6400, t = performance.now()
  const rs = await Promise.all(pool.slice(0, n).map((w, i) =>
    ask(w, [u, x0 + i * c, y0, Math.min(x0 + (i + 1) * c, x1), y1])))
  return {ms: Math.round(performance.now() - t),
    error: rs.find(r => r.error)?.error ?? null,
    flares: rs.flatMap(r => r.flares)}
}
out.textContent = 'ready'
</script>
