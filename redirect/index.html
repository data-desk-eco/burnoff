<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Burnoff has moved to Aerial</title>
<script>
// burnoff and firedamp are one application now. the hash is passed through
// whole rather than translated: aerial reads #vnf= as a legacy spelling of
// #site= and resolves it against both flare tables, so every link ever sent
// from here lands on its own card — including the s2 ones that were dead
// before, which burnoff also wrote #vnf= for. #map= is unchanged.
location.replace('https://aerial.datadesk.eco/' + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://aerial.datadesk.eco/">
<style>
body { background: #000; color: #fff; font: 400 11px/1.6 system-ui, sans-serif; margin: 30px; }
a { color: #fff; }
</style>
</head>
<body>
<p>Burnoff is now part of <a href="https://aerial.datadesk.eco/">Aerial</a>.</p>
</body>
</html>
